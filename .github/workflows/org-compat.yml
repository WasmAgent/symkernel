name: Org Compatibility

# Pre-merge cross-repo compatibility gate (N2-P1-06). Calls the org-owned
# reusable workflow, pinned by immutable SHA, so that vendored-schema and
# contract-sensitive changes cannot merge on local CI alone.
#
# Follow-up: make the "Org compatibility (symkernel)" check required in branch
# protection once this workflow is on main.

on:
  pull_request:
    paths:
      - "schemas/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "**/*.go"
      - "wasmagent-protocol-*.tgz"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  org-compat:
    name: Org compatibility (symkernel)
    uses: WasmAgent/.github/.github/workflows/reusable-compat-check.yml@13bcca67098052c9591353127fac39800cd9876c
    with:
      repo: symkernel
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}
