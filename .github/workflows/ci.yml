name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25'

      - name: "Install Z3 and record exact tested solver version (SK-04)"
        run: |
          set -euo pipefail
          sudo apt-get install -y z3
          z3 --version

      - name: Check vendored schemas against @wasmagent/protocol@0.1.10 (SK-03)
        run: make check-schemas

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short -timeout 300s ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: v2.12.2
          args: --allow-serial-runners --timeout 10m

      - name: staticcheck
        run: |
          # SK-04: pinned — @latest in required CI is forbidden by the org
          # assurance baseline.
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          staticcheck -checks all ./...

      # SK-04: record the exact toolchain the required CI actually ran against.
      # A version range ("4.13.x or later") is not evidence; this snapshot is.
      - name: Record tested toolchain (SK-04)
        run: |
          set -euo pipefail
          cat > tested-toolchain.json <<EOF
          {
            "go": "$(go version | awk '{print $3}')",
            "z3": "$(z3 --version | awk '{print $3}')",
            "staticcheck": "v0.8.1",
            "golangci-lint": "v2.12.2",
            "protocol_version": "$(grep -E '^PROTOCOL_VERSION' Makefile | awk '{print $3}')",
            "source_sha": "${GITHUB_SHA}"
          }
          EOF
          cat tested-toolchain.json

      - name: Upload tested toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-toolchain-${{ github.sha }}
          path: tested-toolchain.json
          retention-days: 90
