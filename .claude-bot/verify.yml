commands:
  # SK-3/SK-4: delegate the schema drift gate to the canonical Makefile target,
  # which verifies the @wasmagent/protocol tarball against the pinned vendor
  # lock and byte-compares the vendored schemas. The former wasmagent-js
  # commit-pinned comparison was a second, inconsistent canonical source.
  - name: schema-drift
    cmd: "make check-schemas"
    timeout: 3m
    level: 1
  - name: build
    cmd: go build ./...
    timeout: 5m
    level: 1
  # SK-4: pinned tool versions — no @latest in the merge gate.
  - name: golangci-lint
    cmd: "export PATH=\"$PATH:/usr/local/go/bin:/home/dev/go/bin:$(go env GOPATH)/bin\"; export GOLANGCI_LINT_CACHE=\"$(mktemp -d)\"; command -v golangci-lint >/dev/null 2>&1 || go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2; golangci-lint run --allow-serial-runners --timeout 10m ./..."
    timeout: 15m
    level: 2
  - name: test
    cmd: go test -short -timeout 300s ./...
    timeout: 8m
    level: 3
  - name: staticcheck-all
    cmd: "export GOCACHE=\"$(mktemp -d)\"; export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin:/usr/local/go/bin:/home/dev/go/bin:$(go env GOPATH)/bin; command -v staticcheck >/dev/null 2>&1 || go install honnef.co/go/tools/cmd/staticcheck@v0.8.1; staticcheck -checks all ./..."
    timeout: 8m
    level: 4
